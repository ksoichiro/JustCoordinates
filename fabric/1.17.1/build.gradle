plugins {
    id 'fabric-loom'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly project(':common')

    if (project.hasProperty('modmenu_version')) {
        modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    }

    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

sourceSets.main {
    java {
        srcDir rootProject.file('common/shared/src/main/java')
    }
    resources {
        srcDir rootProject.file("common/${target_mc_version}/src/main/resources")
    }
}

tasks.named('compileJava') {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

// MC 1.17.1 targets Java 16, but on macOS arm64 Loom injects fabric-loom-native-support (the mod
// that supplies arm64 LWJGL natives for pre-1.19 versions) into dev runs, and that mod requires
// Java 17+. Without this the dev client aborts with "Incompatible mods found!". Only the dev-run
// JVM is raised; compilation still targets 16 via options.release.
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('processResources') {
    filesMatching('fabric.mod.json') {
        expand(
            version: mod_version,
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
        )
    }
}
